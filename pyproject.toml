[project]
name = "chess-lab"
version = "0.1.0"
description = "Maia-style supervised chess policy+value net on Lichess data, rated on a Stockfish-anchored engine ladder"
readme = "README.md"
requires-python = ">=3.12,<3.14"
# License: GPL-3.0 (LICENSE, docs/LICENSES.md). The tooling imports
# python-chess (GPL-3.0-or-later), so the repo is GPL-3.0 as a whole.
dependencies = [
    "chess==1.11.2",
    "numpy>=2.2",
    "psutil>=7.0",
    "zstandard>=0.23",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
train = ["torch>=2.7"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
